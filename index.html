<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sweep and Sleep – Landlord Platform</title>
  
  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />

  <!-- Company Logo for Apple Touch Icon -->
  <link rel="apple-touch-icon" href="images/logo192.png">

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Swiper CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- AOS CSS (Optional for scroll animations) -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body>
  <!-- Video Background (Hero Section) -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="videos/landing.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <img src="images/logo192.png" alt="Sweep and Sleep Logo" class="nav-logo">
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#testimonials">Testimonials</a></li>
        <li><a href="#founder">Founder</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <!-- Light/Dark Mode Toggle Button -->
      <button id="theme-toggle" aria-label="Toggle Light/Dark Mode" class="theme-toggle">
        <i id="theme-icon" class="bi bi-sun"></i>
      </button>
    </div>
  </nav>

  <!-- Main Container for Dynamic Content -->
  <div id="app"></div>

  <!-- Vertical Social Icons -->
  <div class="vertical-social">
    <a href="mailto:support@sweepnsleep.com" target="_blank" aria-label="Email">
      <img src="images/avatar.jpg" alt="Email Icon" class="social-icon" />
    </a>
    <a href="https://www.linkedin.com/company/sweepnsleep" target="_blank" aria-label="LinkedIn">
      <img src="images/Todd.jpg" alt="LinkedIn Icon" class="social-icon" />
    </a>
    <a href="https://github.com/yourcompany" target="_blank" aria-label="GitHub">
      <img src="images/logo192.png" alt="GitHub Icon" class="social-icon" />
    </a>
    <div class="vertical-line"></div>
  </div>

  <!-- JavaScript Files -->
  <script src="app.js"></script>

  <!-- Swiper JS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });
  </script>
</body>
</html>
